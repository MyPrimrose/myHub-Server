spring:
  application:
    name: myhub-server
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/myhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: yanglu-mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
myhub:
  storage:
    path: ./myhub-storage
  library:
    max-file-bytes: 10485760
    max-storage-bytes: 104857600
